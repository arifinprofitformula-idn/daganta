name: Deploy Daganta

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://daganta:daganta@localhost:5432/daganta?schema=public
      DIRECT_URL: postgresql://daganta:daganta@localhost:5432/daganta?schema=public
      AUTH_PROVIDER: credentials
      AUTH_SECRET: ci-build-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_STOREFRONT_ROOT_DOMAIN: daganta.store
      NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: your-anon-key-here
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: your-anon-key-here
      NEXTAUTH_SECRET: ci-build-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/daganta_deploy_key
          chmod 600 ~/.ssh/daganta_deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/daganta_deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            set -euo pipefail
            cd /var/www/daganta
            git pull origin main
            docker compose -f compose.production.yml build --no-cache
            docker compose -f compose.production.yml up -d
            curl -fsS http://localhost:3000/api/health | grep '"status":"ok"'
          EOF
